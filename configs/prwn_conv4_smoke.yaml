# Test rapide sur CPU : verifie que tout le pipeline Conv-4 tourne, pas que le modele apprend.
base: prwn_conv4.yaml
run_name: prwn_conv4_smoke
limit_per_class: 8
input_size: [84, 84]
extract_batch_size: 64
train:
  n_query: 2
  n_unlabeled: 2
  n_distractor_classes: 1
  labeled_ratio: 0.5
  n_steps: 4
  eval_every: 2
  n_val_episodes: 20
eval:
  k_shots: [1]
  n_query: 2
  n_unlabeled: 2
  n_episodes: 20
